site_name: 1A Field Guide
site_description: Practical field guides, investigations, public records, and policy research for understanding public photography, recording, access, and government accountability
site_url: https://publicoversightcoalition.github.io/1A-Field-Guide-Site/
docs_dir: docs
site_dir: site-preview
use_directory_urls: true

theme:
  name: material
  language: en
  font: false
  palette:
    scheme: slate
    primary: black
    accent: deep purple
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - stylesheets/field-guide.css
  - stylesheets/public-beta.css
  - stylesheets/research-reading.css
  - stylesheets/public-beta-motion.css
  - stylesheets/public-beta-editorial.css
  - stylesheets/public-beta-sticky-fix.css
  - stylesheets/public-beta-manifesto-ribbon.css
  - stylesheets/public-beta-card-mask.css
  - stylesheets/public-beta-sticky-boundary.css
  - stylesheets/public-beta-math-field.css
  - stylesheets/sitewide-editorial.css
  - stylesheets/investigations.css

extra_javascript:
  - javascripts/public-beta-motion.js
  - javascripts/public-beta-editorial.js
  - javascripts/investigations-index.js

exclude_docs: |
  templates/**

nav:
  - Home: index.md
  - Explore:
      - Start here: jurisdictions/index.md
      - California — Active: california/README.md
      - Federal — In development: jurisdictions/federal.md
      - Facility & policy registry: registry/index.md
  - Field Guides:
      - Recording public officials: california/recording-public-officials.md
      - Police encounters: california/police-encounters.md
      - Public libraries: california/public-libraries.md
      - Trespass & removal: california/trespass-removal.md
      - Lawful vantage & privacy: california/lawful-vantage-privacy.md
      - Public meetings: california/public-meetings.md
  - Research & Investigations:
      - Browse all: investigations/index.md
      - California:
          - Contra Costa County Library — PITS: california/investigations/contra-costa-library-pits.md
          - Concord Library facility record: registry/concord-library.md
          - Concord Police Department: registry/concord-police.md
          - Healdsburg Police Department: registry/healdsburg-police.md
      - Facility research: registry/index.md
  - Public Records:
      - Start here: open-government/public-records.md
      - California records & evidence preservation: california/public-records-evidence-preservation.md
      - Records requests & retaliation: california/records-request-retaliation.md
      - Federal FOIA: federal/foia.md
  - How It Works:
      - Constitution First: constitution-first.md
      - National core:
          - Complaint-driven police encounter: national-core/complaint-driven-police-encounter.md
          - Lawful-vantage observation and recording: national-core/lawful-vantage-observation-recording.md
      - Facility research method: registry/method.md
      - Forum map standard: registry/forum-map-method.md
      - Registry data model: registry/data-model.md
      - California research:
          - Federal baseline and California constitutional overlay: california/constitutional-foundations.md
          - Authority index: california/AUTHORITY-INDEX.md
          - Qualification matrix: california/QUALIFICATION-MATRIX.md
          - Qualification evidence map: california/QUALIFICATION-EVIDENCE-MAP.md
          - County coverage inventory: california/COUNTY-COVERAGE-INVENTORY.md
          - California activation record: research/CA-GATE-10-CALIFORNIA-ACTIVATION-RECORD.md
          - Standing scenario: california/standing-scenario.md
          - Facility research and field verification: california/facility-investigation-methodology.md
          - Doctrine:
              - Public-forum doctrine: california/public-forum-doctrine.md
              - Indoor public common spaces: california/indoor-public-common-spaces.md
              - Restriction audit: california/restriction-audit.md
              - What can I do in each forum?: california/forum-activity-guide.md
              - Disorderly conduct: california/disorderly-conduct.md
              - Assemblies and emergency scenes: california/assembly-emergency-scenes.md
  - Contribute: https://github.com/PublicOversightCoalition/1A-Field-Guide-Site/blob/main/CONTRIBUTING.md
