name: Publish temporary Public Beta preview

on:
  push:
    branches:
      - preview-public-beta-v01
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-beta-preview-publish
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a13d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: preview/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r preview/requirements.txt

      - name: Validate and build
        run: |
          python tools/jurisdictions/validate_shell.py
          python tools/registry/validate_restriction_corpus.py
          python tools/registry/build_registry.py
          python tools/registry/build_registry.py --check
          python tools/member_portal/render_config.py check docs
          python -m mkdocs build --clean

      - name: Render inert preview member config
        env:
          COALITION_SUPABASE_URL: https://exampleproject.supabase.co
          COALITION_SUPABASE_PUBLISHABLE_KEY: sb_publishable__preview_not_a_real_key_12345
        run: python tools/member_portal/render_config.py render site-preview

      - name: Publish preview subdirectory to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages
          PUBLISH_DIR="$RUNNER_TEMP/1A-Field-Guide-gh-pages-preview"
          git worktree add "$PUBLISH_DIR" gh-pages
          mkdir -p "$PUBLISH_DIR/public-beta-v01"
          rm -rf "$PUBLISH_DIR/public-beta-v01"/*
          cp -a site-preview/. "$PUBLISH_DIR/public-beta-v01/"
          touch "$PUBLISH_DIR/.nojekyll"
          cd "$PUBLISH_DIR"
          git add public-beta-v01 .nojekyll
          if git diff --cached --quiet; then
            echo "Preview already up to date."
            exit 0
          fi
          git commit -m "Publish temporary Public Beta preview"
          git push origin gh-pages
