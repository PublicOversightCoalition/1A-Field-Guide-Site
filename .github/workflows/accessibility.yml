name: WCAG 2.2 AA rendered site screening

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Build site preview
        run: |
          python -m pip install -r preview/requirements.txt
          python tools/member_portal/inject_workspace_theme.py
          python -m mkdocs build --clean
          COALITION_SUPABASE_URL=https://exampleproject.supabase.co COALITION_SUPABASE_PUBLISHABLE_KEY=sb_publishable__example_not_a_real_key_12345 python tools/member_portal/render_config.py render site-preview
      - name: Install accessibility test dependencies
        run: |
          npm install --prefix tools/accessibility --no-audit --no-fund
          cd tools/accessibility
          npx playwright install --with-deps chromium
      - name: Audit generated pages in Chromium
        run: |
          ln -s site-preview 1A-Field-Guide-Site
          python -m http.server 8765 --bind 127.0.0.1 --directory . > /tmp/field-guide-audit-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          node tools/accessibility/audit.mjs
          node tools/accessibility/functional-journeys.mjs
      - name: Upload JSON findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wcag-2-2-aa-screening
          path: |
            audit-results/wcag-screening.json
            audit-results/functional-journeys.json
          if-no-files-found: warn
